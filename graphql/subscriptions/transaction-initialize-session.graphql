subscription TransactionInitializeSession {
  event {
    ... on TransactionInitializeSession {
      issuedAt
      version
      merchantReference
      idempotencyKey
      data
      action {
        amount
        currency
        actionType
      }
      transaction {
        ...SellAbroadTransaction
      }
      sourceObject {
        ...SellAbroadSourceObject
      }
    }
  }
}
